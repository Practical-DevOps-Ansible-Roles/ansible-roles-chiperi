---
- name: Install PostgreSQL
  apt:
    name: postgresql
    state: present

- name: Create PostgreSQL database
  postgresql_db:
    name: "{{ db_name }}"
    state: present

- name: Create PostgreSQL user
  postgresql_user:
    name: "{{ db_user }}"
    password: "{{ db_password }}"
    priv: "ALL"
    state: present